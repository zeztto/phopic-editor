  <rect width="1200" height="630" fill="#F9FAFB"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E7EB" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Main Card -->
  <rect x="100" y="115" width="1000" height="400" rx="20" fill="white" filter="drop-shadow(0 20px 60px rgba(0,0,0,0.1))"/>
  
  <!-- Icon -->
  <rect x="200" y="215" width="200" height="200" rx="20" fill="#6366F1"/>
  <rect x="230" y="255" width="140" height="120" rx="10" fill="white"/>
  <circle cx="270" cy="295" r="15" fill="#6366F1"/>
  <path d="M230 345L270 305L310 345L350 305L370 325V355C370 360.523 365.523 365 360 365H240C234.477 365 230 360.523 230 355V345Z" fill="#6366F1"/>
  
  <!-- Text -->\n  <text x="450" y="270" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#111827">
